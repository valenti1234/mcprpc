[project]
name = "mcprpc-registry"
version = "0.1.7"
description = "MCP-native function registry for polyglot function mesh systems"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "mcprpc contributors" }]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "sqlmodel>=0.0.8",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0"
]
keywords = ["mcp", "mcprpc", "registry"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.urls]
Homepage = "https://github.com/valenti/mcprpc"
Repository = "https://github.com/valenti/mcprpc"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "httpx>=0.24.0"
]

[project.scripts]
mcprpc-registry = "app.main:cli"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
