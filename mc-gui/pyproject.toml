[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcprpc-gui"
version = "0.1.6"
description = "Web UI for mcprpc registry and router"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "mcprpc contributors" }]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "httpx>=0.27.0",
]
requires-python = ">=3.10"
keywords = ["mcp", "mcprpc", "gui"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.urls]
Homepage = "https://github.com/valenti/mcprpc"
Repository = "https://github.com/valenti/mcprpc"

[project.optional-dependencies]
test = [
  "pytest",
  "httpx",
]

[project.scripts]
mcprpc-gui = "app.main:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
app = ["static/*"]
