[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mc-automesh"
version = "0.1.4"
description = "Automatically expose existing Python functions as MCP tools and publish them into mcprpc-registry without manual wrappers."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "AutoMesh Contributors" }
]
dependencies = [
    "mcp>=1.2.0",
    "pydantic>=2.0.0",
    "requests>=2.31.0"
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "responses>=0.23.0"
]

[tool.hatch.build.targets.wheel]
packages = ["src/mc_automesh"]
