name: CI

on:
  push:
  pull_request:

jobs:
  python:
    name: Python (${{ matrix.package }} on ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        package:
          - mr-registry
          - mr-router
          - mc-gui
          - mc-automesh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install -U pytest
          cd "${{ matrix.package }}"
          if [ -f pyproject.toml ]; then
            python -m pip install -e ".[test]" || python -m pip install -e ".[dev]" || python -m pip install -e .
          fi

      - name: Test
        run: |
          cd "${{ matrix.package }}"
          python -m compileall -q .
          if [ -d tests ]; then
            python -m pytest -q
          else
            echo "No tests/ directory; skipping pytest."
          fi

  node:
    name: Node (mc-node-automesh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: mc-node-automesh/package-lock.json

      - name: Install
        run: |
          cd mc-node-automesh
          npm ci

      - name: Build
        run: |
          cd mc-node-automesh
          npm run build

      - name: Test
        run: |
          cd mc-node-automesh
          npm test
